name: Azure Static Web Apps CI/CD

# Deploy-only-on-merge: no pull_request trigger. On a public repo, anyone can
# open a PR (via a fork) without any write access to this repo — that's a
# separate, much lower permission bar than push access. Reacting to
# pull_request here would let an external PR trigger a real build against
# our Azure resource. Deploying only on push to main means a deploy only ever
# happens after a merge, which requires actual write access.
on:
  push:
    branches:
      - main
    paths:
      - "src/pwa/**"
      - ".github/workflows/azure-static-web-apps-black-rock-05e7e8f03.yml"

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_ROCK_05E7E8F03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./src/pwa" # App source code path
          api_location: "" # No API — the PWA needs no backend for its core loop (see CLAUDE.md)
          output_location: ".output/public" # Built app content directory - optional
          app_build_command: "npm run generate" # `nuxt build` (the default) renders index.html at request time via a Node server, which SWA static hosting can't run — `nuxt generate` prerenders real HTML files instead.
          ###### End of Repository/Build Configurations ######
